<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>El Coleccionista de Matrículas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <style>
        .plate-font { font-family: 'Courier New', Courier, monospace; letter-spacing: 5px; }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans overflow-x-hidden">

    <div id="login-screen" class="fixed inset-0 flex flex-col items-center justify-start p-6 bg-slate-900 overflow-y-auto z-[500]">
        <h1 class="text-3xl font-black text-yellow-400 mt-10 mb-2 italic tracking-tighter">EL COLECCIONISTA</h1>
        <p class="text-slate-400 text-xs mb-10 tracking-[0.3em] uppercase">De Números</p>
        
        <h2 class="text-xl font-bold mb-6">¿Quién va a cazar hoy?</h2>
        
        <div class="grid grid-cols-1 gap-4 w-full max-w-xs pb-10">
            <button onclick="selectPlayer('NOA')" class="bg-slate-800 p-4 rounded-2xl flex items-center gap-4 border-2 border-transparent active:border-pink-500 active:scale-95 transition-all">
                <img src="https://github.com/jakeko99-pixel/matriculas/blob/main/Noa%20Lodres%20Juego.jpeg?raw=true" class="w-16 h-16 rounded-full object-cover border-2 border-pink-500">
                <span class="text-2xl font-bold">NOA</span>
            </button>
            <button onclick="selectPlayer('ERIK')" class="bg-slate-800 p-4 rounded-2xl flex items-center gap-4 border-2 border-transparent active:border-blue-500 active:scale-95 transition-all">
                <img src="https://github.com/jakeko99-pixel/matriculas/blob/main/Erik%20Juego.png?raw=true" class="w-16 h-16 rounded-full object-cover border-2 border-blue-500">
                <span class="text-2xl font-bold">ERIK</span>
            </button>
            <button onclick="selectPlayer('FER')" class="bg-slate-800 p-4 rounded-2xl flex items-center gap-4 border-2 border-transparent active:border-green-500 active:scale-95 transition-all">
                <img src="https://github.com/jakeko99-pixel/matriculas/blob/main/Fer%20juego.jpeg?raw=true" class="w-16 h-16 rounded-full object-cover border-2 border-green-500">
                <span class="text-2xl font-bold">FER</span>
            </button>
        </div>
    </div>

    <div id="main-app" class="hidden min-h-screen pb-40">
        <div class="bg-slate-900 p-6 rounded-b-3xl shadow-2xl flex items-center justify-between border-b border-slate-800 sticky top-0 z-40">
            <div class="flex items-center gap-3">
                <img id="current-avatar" src="" class="w-12 h-12 rounded-full border-2 border-yellow-400 object-cover">
                <div>
                    <p id="current-name" class="font-black text-lg leading-tight text-yellow-400"></p>
                    <p class="text-[9px] text-slate-500 uppercase font-bold tracking-widest italic">Cazador Activo</p>
                </div>
            </div>
            <div class="text-right">
                <p id="user-points" class="text-4xl font-black text-white leading-none">0</p>
                <p class="text-[10px] text-yellow-500 uppercase font-bold tracking-tighter">Puntos Totales</p>
            </div>
        </div>

        <div class="p-6">
            <div class="flex items-center justify-between mb-4 px-1">
                <h3 class="text-slate-400 text-[10px] font-black uppercase tracking-[0.2em]">Ranking Familiar</h3>
                <div class="flex items-center gap-1.5">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    <span class="text-[10px] text-slate-400 font-bold uppercase">En Vivo</span>
                </div>
            </div>
            <div id="leaderboard" class="space-y-3"></div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 p-6 bg-slate-950/90 backdrop-blur-xl border-t border-slate-800 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
            <div class="max-w-md mx-auto">
                <p class="text-center text-[10px] text-slate-400 mb-3 font-bold uppercase tracking-widest">Introduce los 4 números</p>
                <div class="flex gap-3">
                    <input id="plate-input" type="number" pattern="[0-9]*" inputmode="numeric" placeholder="0000" 
                        class="flex-1 bg-slate-800 text-white rounded-2xl p-4 text-center text-3xl font-black plate-font outline-none border-2 border-slate-700 focus:border-yellow-400 transition-all">
                    <button onclick="addPlate()" class="bg-yellow-400 text-slate-900 font-black px-8 rounded-2xl text-lg active:scale-90 transition-all shadow-lg">
                        ¡CAZAR!
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://el-coleccionista-de-matriculas-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentPlayer = null;
        const avatars = {
            'NOA': 'https://github.com/jakeko99-pixel/matriculas/blob/main/Noa%20Lodres%20Juego.jpeg?raw=true',
            'ERIK': 'https://github.com/jakeko99-pixel/matriculas/blob/main/Erik%20Juego.png?raw=true',
            'FER': 'https://github.com/jakeko99-pixel/matriculas/blob/main/Fer%20juego.jpeg?raw=true'
        };

        function selectPlayer(name) {
            currentPlayer = name;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('current-name').innerText = name;
            document.getElementById('current-avatar').src = avatars[name];
            listenToData();
        }

        function listenToData() {
            db.ref('users').on('value', (snapshot) => {
                const users = snapshot.val() || {};
                if (users[currentPlayer]) {
                    document.getElementById('user-points').innerText = users[currentPlayer].points || 0;
                }

                const sortedUsers = Object.entries(users)
                    .map(([name, data]) => ({ name, ...data }))
                    .sort((a, b) => (b.points || 0) - (a.points || 0));

                const leaderboard = document.getElementById('leaderboard');
                leaderboard.innerHTML = sortedUsers.map((u, index) => `
                    <div class="flex items-center justify-between bg-slate-900/40 p-4 rounded-3xl border border-slate-800 shadow-sm ${u.name === currentPlayer ? 'border-yellow-500/50 bg-yellow-500/5' : ''}">
                        <div class="flex items-center gap-4">
                            <span class="text-slate-600 font-black text-sm italic w-4">${index + 1}</span>
                            <img src="${avatars[u.name]}" class="w-12 h-12 rounded-full border-2 border-slate-700 object-cover">
                            <div>
                                <span class="font-bold text-slate-100 block">${u.name}</span>
                                <span class="text-[8px] text-slate-500 uppercase tracking-widest font-black">Cazador</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-2xl font-black text-white leading-none">${u.points || 0}</span>
                            <p class="text-[8px] text-yellow-400 font-bold uppercase tracking-tighter">Puntos</p>
                        </div>
                    </div>
                `).join('');
            });
        }

        function addPlate() {
            const input = document.getElementById('plate-input');
            let rawValue = input.value.toString();
            
            // Extraer solo los números
            const numbersOnly = rawValue.replace(/\D/g, '');

            if (numbersOnly.length !== 4) {
                alert("❌ ¡Error! Introduce exactamente los 4 números.");
                return;
            }

            // Comprobar si EL JUGADOR ACTUAL ya ha cazado este número antes
            db.ref(`users/${currentPlayer}/my_plates/${numbersOnly}`).once('value', (userSnap) => {
                if (userSnap.exists()) {
                    alert(`⚠️ ${currentPlayer}, ¡ya habías cazado el ${numbersOnly}! Busca otro.`);
                    input.value = "";
                } else {
                    // Si es nuevo para el jugador, procedemos
                    db.ref(`plates/${numbersOnly}`).once('value', (globalSnap) => {
                        let pointsToAdd = 1; // Punto base por caza
                        let message = "✅ ¡Punto conseguido!";

                        // REGLA BONUS: Si no estaba en el común (nadie lo ha cazado antes)
                        if (!globalSnap.exists()) {
                            pointsToAdd = 2; // 1 base + 1 extra
                            message = "🔥 ¡BONUS! Eres el primero en encontrar el " + numbersOnly + ". (+2 Puntos)";
                            
                            // Guardar en el común que ya ha sido descubierto
                            db.ref(`plates/${numbersOnly}`).set({
                                discoverer: currentPlayer,
                                date: Date.now()
                            });
                        }

                        // Registrar que este usuario ya tiene este número
                        db.ref(`users/${currentPlayer}/my_plates/${numbersOnly}`).set(true);

                        // Sumar los puntos correspondientes
                        db.ref(`users/${currentPlayer}/points`).transaction((current) => {
                            return (current || 0) + pointsToAdd;
                        });

                        alert(message);
                        input.value = "";
                    });
                }
            });
        }
    </script>
</body>
</html>
