<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>El Coleccionista de Matrículas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #020617; color: white; overscroll-behavior-y: none; }
        .plate-font { font-family: 'Courier New', Courier, monospace; letter-spacing: 2px; }
        
        @keyframes fadeUpOut {
            0% { transform: translate(-50%, -10%); opacity: 0; }
            20% { transform: translate(-50%, -50%); opacity: 1; scale: 1.1; }
            80% { transform: translate(-50%, -50%); opacity: 1; scale: 1; }
            100% { transform: translate(-50%, -90%); opacity: 0; }
        }
        .toast-active { animation: fadeUpOut 2.5s forwards; display: flex !important; }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-full overflow-hidden">

    <div id="splash" onclick="closeSplash()" class="fixed inset-0 z-[1000] bg-slate-950 transition-opacity duration-500 cursor-pointer overflow-hidden p-6 flex flex-col">
        <img src="https://raw.githubusercontent.com/jakeko99-pixel/matriculas/main/icono.png" class="absolute inset-0 w-full h-full object-contain -translate-y-16 animate-pulse drop-shadow-[0_0_25px_rgba(250,204,21,0.3)]">
        <div class="absolute bottom-16 left-0 right-0 text-center space-y-2 z-10 px-6">
            <h1 class="text-3xl font-black text-yellow-400 italic tracking-tighter bg-slate-950/60 inline-block p-1 rounded">EL COLECCIONISTA</h1>
            <p class="text-slate-500 text-xs tracking-[0.4em] uppercase bg-slate-950/60 inline-block p-1 rounded">De Matrículas</p>
            <p class="mt-8 text-slate-400 text-sm animate-bounce font-bold bg-slate-900 px-6 py-2 rounded-full inline-block">Toca para empezar</p>
        </div>
    </div>

    <div id="login-screen" class="hidden fixed inset-0 flex flex-col items-center justify-between bg-slate-950 z-[500] p-6 py-12">
        <div class="flex flex-col items-center w-full">
            <img src="https://raw.githubusercontent.com/jakeko99-pixel/matriculas/main/icono.png" class="w-32 h-32 object-contain mb-6 drop-shadow-[0_0_15px_rgba(250,204,21,0.2)]">
            <h2 class="text-2xl font-black text-white italic">¿Quién caza hoy?</h2>
        </div>
        
        <div class="grid grid-cols-1 gap-4 w-full max-w-sm my-8">
            <button onclick="selectPlayer('NOA')" class="bg-slate-900 p-4 rounded-3xl flex items-center gap-4 border border-slate-800 active:border-pink-500 transition-all shadow-lg hover:bg-slate-800">
                <img src="https://github.com/jakeko99-pixel/matriculas/blob/main/Noa%20Lodres%20Juego.jpeg?raw=true" class="w-16 h-16 rounded-full border-2 border-pink-500 object-cover">
                <div class="text-left">
                    <span class="text-2xl font-black uppercase tracking-wide block leading-none mb-1">Noa</span>
                    <span id="level-NOA" class="text-[10px] font-bold text-yellow-400 tracking-widest uppercase bg-slate-950 px-2 py-1 rounded border border-slate-800">Calculando...</span>
                </div>
            </button>
            <button onclick="selectPlayer('ERIK')" class="bg-slate-900 p-4 rounded-3xl flex items-center gap-4 border border-slate-800 active:border-blue-500 transition-all shadow-lg hover:bg-slate-800">
                <img src="https://github.com/jakeko99-pixel/matriculas/blob/main/Erik%20Juego.png?raw=true" class="w-16 h-16 rounded-full border-2 border-blue-500 object-cover">
                <div class="text-left">
                    <span class="text-2xl font-black uppercase tracking-wide block leading-none mb-1">Erik</span>
                    <span id="level-ERIK" class="text-[10px] font-bold text-yellow-400 tracking-widest uppercase bg-slate-950 px-2 py-1 rounded border border-slate-800">Calculando...</span>
                </div>
            </button>
            <button onclick="selectPlayer('FER')" class="bg-slate-900 p-4 rounded-3xl flex items-center gap-4 border border-slate-800 active:border-green-500 transition-all shadow-lg hover:bg-slate-800">
                <img src="https://github.com/jakeko99-pixel/matriculas/blob/main/Fer%20juego.jpeg?raw=true" class="w-16 h-16 rounded-full border-2 border-green-500 object-cover">
                <div class="text-left">
                    <span class="text-2xl font-black uppercase tracking-wide block leading-none mb-1">Fer</span>
                    <span id="level-FER" class="text-[10px] font-bold text-yellow-400 tracking-widest uppercase bg-slate-950 px-2 py-1 rounded border border-slate-800">Calculando...</span>
                </div>
            </button>
        </div>

        <button onclick="openStats()" class="bg-yellow-400 text-slate-950 font-black px-8 py-4 rounded-2xl w-full max-w-sm shadow-[0_0_20px_rgba(250,204,21,0.2)] active:scale-95 transition-transform flex items-center justify-center gap-2 mt-auto">
            <span>🏆</span> VER RANKING Y ESTADÍSTICAS
        </button>
    </div>

    <div id="stats-modal" class="hidden fixed inset-0 bg-slate-950 z-[600] flex flex-col">
        <div class="p-6 bg-slate-900 border-b border-slate-800 flex justify-between items-center">
            <h2 class="text-xl font-black text-yellow-400">Ranking y Estadísticas</h2>
            <button onclick="closeStats()" class="bg-slate-800 text-white px-4 py-2 rounded-lg font-bold">Cerrar</button>
        </div>
        <div class="flex-1 overflow-y-auto p-6 space-y-6" id="stats-content">
            </div>
    </div>

    <div id="universe-modal" class="hidden fixed inset-0 bg-slate-950 z-[650] flex flex-col">
        <div class="p-6 bg-slate-900 border-b border-slate-800 flex justify-between items-center">
            <h2 id="universe-title" class="text-xl font-black text-white">Bloques de Matrículas</h2>
            <button onclick="closeUniverse()" class="bg-slate-800 text-white px-4 py-2 rounded-lg font-bold">Volver</button>
        </div>
        <div class="flex-1 overflow-y-auto p-6 grid grid-cols-1 gap-4 content-start" id="universe-content">
            </div>
    </div>

    <div id="thousand-modal" class="hidden fixed inset-0 bg-slate-950 z-[750] flex flex-col">
        <div class="p-6 bg-slate-900 border-b border-slate-800 flex flex-col gap-4">
            <div class="flex justify-between items-center">
                <h2 id="thousand-title" class="text-2xl font-black text-yellow-400 tracking-widest">0000 - 0999</h2>
                <button onclick="closeThousand()" class="bg-slate-800 text-white px-4 py-2 rounded-lg font-bold">Atrás</button>
            </div>
            <div class="flex bg-slate-950 rounded-lg p-1 border border-slate-800">
                <button id="tab-collected" onclick="switchThousandTab('collected')" class="flex-1 py-3 text-sm font-bold rounded-md bg-yellow-400 text-slate-900 transition-all">Conseguidas (<span id="count-collected">0</span>)</button>
                <button id="tab-missing" onclick="switchThousandTab('missing')" class="flex-1 py-3 text-sm font-bold rounded-md text-slate-400 transition-all">Faltan (<span id="count-missing">0</span>)</button>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto p-4 bg-slate-950" id="thousand-content">
            </div>
    </div>

    <div id="details-modal" class="hidden fixed inset-0 bg-slate-950 z-[700] flex flex-col">
        <div class="p-6 bg-slate-900 border-b border-slate-800 flex justify-between items-center">
            <h2 id="details-title" class="text-lg font-black text-white uppercase tracking-wide">Detalles</h2>
            <button onclick="closeDetails()" class="bg-slate-800 text-white px-4 py-2 rounded-lg font-bold">Volver</button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 bg-slate-950" id="details-content">
            </div>
    </div>

    <div id="endgame-modal" class="hidden fixed inset-0 bg-slate-950 z-[9999] flex flex-col items-center justify-center p-6 text-center transition-opacity duration-500">
        <h1 class="text-4xl font-black text-yellow-400 mb-8 animate-pulse tracking-widest uppercase">¡MISIÓN CUMPLIDA!</h1>
        <img id="endgame-avatar" src="" class="w-40 h-40 rounded-full border-4 border-yellow-400 object-cover mb-8 hidden shadow-[0_0_40px_rgba(250,204,21,0.6)] transition-all transform scale-0 animate-[popIn_0.5s_forwards]">
        <p id="endgame-text" class="text-2xl text-white font-bold leading-relaxed"></p>
        <button id="endgame-close" onclick="closeEndGame()" class="hidden mt-10 bg-yellow-400 text-slate-950 font-black px-8 py-4 rounded-2xl shadow-[0_0_20px_rgba(250,204,21,0.3)] active:scale-95 transition-transform w-full max-w-xs">
            VER RANKING FINAL 🏆
        </button>
    </div>

    <div id="main-app" class="hidden flex-1 flex flex-col relative w-full h-full overflow-hidden">
        <header class="bg-slate-900 p-4 border-b border-slate-800 flex justify-between items-center shadow-md shrink-0">
            <div class="flex items-center gap-3">
                <img id="current-avatar" src="" class="w-10 h-10 rounded-full border-2 border-yellow-400 object-cover shrink-0">
                <h1 id="current-name" class="font-black text-xl text-white uppercase tracking-wider truncate"></h1>
            </div>
            <div class="text-right shrink-0">
                <span id="user-points" class="text-3xl font-black text-yellow-400 leading-none">0</span>
                <span class="text-[9px] text-slate-400 uppercase font-bold block">Puntos Reales</span>
            </div>
        </header>

        <div id="quick-toast" class="hidden fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 px-8 py-4 rounded-3xl font-black text-center z-[9999] shadow-[0_20px_50px_rgba(0,0,0,0.9)] pointer-events-none flex-col items-center gap-2 justify-center">
            <span id="toast-text" class="text-5xl"></span>
            <span id="toast-subtext" class="text-lg text-white/90"></span>
        </div>

        <main class="flex-1 flex flex-col items-center justify-start pt-16 sm:pt-24 p-6 relative w-full overflow-y-auto">
            <div class="w-full max-w-[320px] sm:max-w-sm space-y-6 mx-auto">
                <div class="text-center">
                    <p class="text-yellow-500 text-[10px] font-black tracking-[0.3em] uppercase mb-2">Nueva Matrícula</p>
                    <div class="relative flex items-stretch shadow-[0_0_30px_rgba(250,204,21,0.15)] rounded-2xl bg-white focus-within:ring-4 focus-within:ring-yellow-400/50 transition-all overflow-hidden w-full">
                        <div class="bg-blue-700 w-10 shrink-0 flex flex-col items-center justify-center p-1">
                            <span class="text-[12px] font-black text-white">E</span>
                        </div>
                        <input id="plate-input" type="number" pattern="[0-9]*" inputmode="numeric" placeholder="0000" class="flex-1 min-w-0 w-full bg-white text-slate-900 text-center text-5xl sm:text-6xl font-black plate-font outline-none py-4" onkeypress="if(event.key === 'Enter') addPlate()">
                    </div>
                </div>
                <button onclick="addPlate()" class="w-full bg-yellow-400 text-slate-950 font-black py-4 rounded-xl text-xl shadow-lg active:scale-95 transition-transform">
                    CAZAR (INTRO)
                </button>
            </div>
        </main>

        <div id="recent-panel" class="absolute bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-700 transition-transform duration-300 transform translate-y-full h-[60vh] flex flex-col shadow-[0_-10px_40px_rgba(0,0,0,0.5)] z-40">
            <div class="p-4 flex justify-between items-center border-b border-slate-800 bg-slate-950 shrink-0">
                <h3 class="font-black text-yellow-400">Tus Últimas 10 Capturas</h3>
                <button onclick="toggleRecent()" class="bg-slate-800 p-2 rounded text-xs font-bold">Cerrar ▼</button>
            </div>
            <div id="recent-list" class="flex-1 overflow-y-auto p-4 space-y-2 bg-slate-900"></div>
        </div>

        <footer class="bg-slate-950 p-4 pb-8 border-t border-slate-800 flex flex-col gap-3 z-30 shrink-0">
            <div class="grid grid-cols-2 gap-3">
                <button onclick="toggleRecent()" class="bg-slate-900 border border-slate-700 py-4 rounded-2xl font-black text-sm text-slate-300 flex flex-col items-center justify-center gap-1 active:bg-slate-800 shadow-lg">
                    <span class="text-xl">⏱️</span> Últimas Cazadas
                </button>
                <button onclick="openUniverse(currentPlayer)" class="bg-slate-900 border border-slate-700 py-4 rounded-2xl font-black text-sm text-yellow-400 flex flex-col items-center justify-center gap-1 active:bg-slate-800 shadow-lg border-b-2 border-b-yellow-500/50">
                    <span class="text-xl">📖</span> Mi Álbum
                </button>
            </div>
            <button onclick="openStats()" class="bg-slate-900 border border-slate-700 py-4 rounded-2xl font-black text-base text-white flex items-center justify-center gap-2 active:bg-slate-800 shadow-lg">
                <span>🏆</span> Ranking General
            </button>
        </footer>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://el-coleccionista-de-matriculas-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentPlayer = null;
        let consolidatedUserPlates = {}; 
        let globalDataCache = {};
        window.currentModalData = { NOA: {}, ERIK: {}, FER: {}, GLOBAL: [] };
        
        let currentUniverseScope = 'GLOBAL';

        const defaultAvatars = {
            'NOA': 'https://github.com/jakeko99-pixel/matriculas/blob/main/Noa%20Lodres%20Juego.jpeg?raw=true',
            'ERIK': 'https://github.com/jakeko99-pixel/matriculas/blob/main/Erik%20Juego.png?raw=true',
            'FER': 'https://github.com/jakeko99-pixel/matriculas/blob/main/Fer%20juego.jpeg?raw=true'
        };

        function isPoker(str) { return str.length === 4 && str[0] === str[1] && str[1] === str[2] && str[2] === str[3]; }
        function isEscoba(str) { return str.length === 4 && (parseInt(str[0]) + parseInt(str[1]) + parseInt(str[2]) + parseInt(str[3]) === 15); }
        function isCapicua(str) { return str.length === 4 && str[0] === str[3] && str[1] === str[2]; }

        function getPlateBaseValue(str) {
            if (isPoker(str)) return 10;
            if (isEscoba(str)) return 15;
            if (isCapicua(str)) return 5;
            return 1;
        }

        function calculateExactPoints(plateStr, isFirst) {
            let base = getPlateBaseValue(plateStr);
            if (!isFirst) return base;
            if (base === 1) return base + 1; 
            else return base + 5; 
        }

        function getLevel(points) {
            if (points < 50) return "🚶 Peatón";
            if (points < 200) return "🗺️ Copiloto";
            if (points < 500) return "🚗 Conductor";
            if (points < 1000) return "🔍 Rastreador";
            if (points < 2500) return "🦅 Cazador";
            if (points < 5000) return "👑 Leyenda";
            return "🌩️ Dios del Asfalto";
        }

        function closeSplash() {
            document.getElementById('splash').classList.add('opacity-0');
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('login-screen').classList.remove('hidden');
            }, 500);
        }

        function openStats() { document.getElementById('stats-modal').classList.remove('hidden'); renderStats(); }
        function closeStats() { document.getElementById('stats-modal').classList.add('hidden'); }

        function openUniverse(scope) {
            currentUniverseScope = scope || 'GLOBAL';
            const plates = currentUniverseScope === 'GLOBAL' ? window.currentModalData.GLOBAL : (window.currentModalData[currentUniverseScope]?.aportadas || []);
            
            document.getElementById('universe-title').innerText = currentUniverseScope === 'GLOBAL' ? "Misión Familiar" : `Álbum de ${currentUniverseScope}`;

            let content = '';
            for(let i=0; i<10; i++) {
                let prefix = i.toString();
                let count = plates.filter(p => p.startsWith(prefix)).length;
                let pct = (count / 1000) * 100;
                
                content += `
                    <button onclick="openThousand(${i})" class="bg-slate-800 p-5 rounded-2xl border border-slate-700 active:border-yellow-400 text-left relative overflow-hidden flex justify-between items-center shadow-md">
                        <div class="relative z-10">
                            <span class="text-xl font-black text-white block mb-1">Empiezan por ${i}</span>
                            <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest bg-slate-900 px-2 py-1 rounded border border-slate-700">${count} / 1000 capturadas</span>
                        </div>
                        <span class="text-2xl z-10 bg-slate-900 w-10 h-10 flex items-center justify-center rounded-full border border-slate-700 text-yellow-400">➔</span>
                        <div class="absolute left-0 bottom-0 h-1.5 bg-yellow-400 transition-all" style="width: ${pct}%"></div>
                    </button>
                `;
            }
            document.getElementById('universe-content').innerHTML = content;
            document.getElementById('universe-modal').classList.remove('hidden');
        }
        function closeUniverse() { document.getElementById('universe-modal').classList.add('hidden'); }

        let currentThousandDigit = 0;
        let currentThousandTab = 'collected';

        function openThousand(digit) {
            currentThousandDigit = digit;
            currentThousandTab = 'collected'; 
            
            document.getElementById('thousand-title').innerText = `${digit}000 - ${digit}999`;
            document.getElementById('tab-collected').className = "flex-1 py-3 text-sm font-bold rounded-md bg-yellow-400 text-slate-900 transition-all";
            document.getElementById('tab-missing').className = "flex-1 py-3 text-sm font-bold rounded-md text-slate-400 transition-all";
            
            document.getElementById('thousand-modal').classList.remove('hidden');
            renderThousandContent();
        }
        function closeThousand() { document.getElementById('thousand-modal').classList.add('hidden'); }

        function switchThousandTab(tab) {
            currentThousandTab = tab;
            if(tab === 'collected') {
                document.getElementById('tab-collected').className = "flex-1 py-3 text-sm font-bold rounded-md bg-yellow-400 text-slate-900 transition-all shadow-md";
                document.getElementById('tab-missing').className = "flex-1 py-3 text-sm font-bold rounded-md text-slate-400 transition-all";
            } else {
                document.getElementById('tab-missing').className = "flex-1 py-3 text-sm font-bold rounded-md bg-slate-800 text-red-400 transition-all shadow-md border border-slate-700";
                document.getElementById('tab-collected').className = "flex-1 py-3 text-sm font-bold rounded-md text-slate-400 transition-all";
            }
            renderThousandContent();
        }

        function renderThousandContent() {
            const plates = currentUniverseScope === 'GLOBAL' ? window.currentModalData.GLOBAL : (window.currentModalData[currentUniverseScope]?.aportadas || []);
            const prefix = currentThousandDigit.toString();
            
            let collected = plates.filter(p => p.startsWith(prefix)).sort((a,b) => parseInt(a)-parseInt(b));
            
            document.getElementById('count-collected').innerText = collected.length;
            document.getElementById('count-missing').innerText = 1000 - collected.length;

            let html = '<div class="grid grid-cols-3 gap-2">'; 
            
            if (currentThousandTab === 'collected') {
                if(collected.length === 0) {
                    document.getElementById('thousand-content').innerHTML = '<div class="text-center mt-10"><span class="text-4xl mb-4 block">👻</span><p class="text-slate-500 font-bold">Aún no hay matrículas cazadas en este bloque.</p></div>';
                    return;
                }
                collected.forEach(p => {
                    html += `
                        <div class="bg-slate-800 rounded-lg flex items-center shadow-md border border-slate-700 justify-center p-2 py-3">
                            <span class="text-white font-black plate-font text-base tracking-widest">${p}</span>
                        </div>
                    `;
                });
            } else {
                let collectedSet = new Set(collected);
                let missingCount = 0;
                for(let i=0; i<=999; i++) {
                    let numStr = prefix + i.toString().padStart(3, '0');
                    if(!collectedSet.has(numStr)) {
                        missingCount++;
                        html += `
                            <div class="bg-slate-950 rounded-lg flex items-center border border-red-900/30 justify-center p-2 py-3 opacity-60">
                                <span class="text-red-500 font-black plate-font text-base tracking-widest">${numStr}</span>
                            </div>
                        `;
                    }
                }
                if(missingCount === 0) {
                    document.getElementById('thousand-content').innerHTML = '<div class="text-center mt-10"><span class="text-5xl mb-4 block">🏆</span><p class="text-yellow-400 font-black text-xl">¡BLOQUE COMPLETADO!</p></div>';
                    return;
                }
            }
            html += '</div>';
            document.getElementById('thousand-content').innerHTML = html;
        }

        function showDetails(title, dataKey, subKey) {
            document.getElementById('details-title').innerText = title;
            const content = document.getElementById('details-content');
            let platesArray = window.currentModalData[dataKey][subKey] || [];

            if (platesArray.length === 0) {
                content.innerHTML = '<p class="text-slate-500 text-center mt-10">Todavía no hay matrículas aquí.</p>';
            } else {
                platesArray.sort((a, b) => parseInt(a) - parseInt(b));
                let html = '<div class="grid grid-cols-3 gap-2">';
                platesArray.forEach(p => {
                    html += `
                        <div class="bg-slate-800 rounded-lg flex items-center shadow-sm border border-slate-700 justify-center p-2 py-3">
                            <span class="text-white font-black plate-font text-base tracking-widest">${p}</span>
                        </div>
                    `;
                });
                html += '</div>';
                content.innerHTML = html;
            }
            document.getElementById('details-modal').classList.remove('hidden');
        }
        function closeDetails() { document.getElementById('details-modal').classList.add('hidden'); }

        function renderStats() {
            const content = document.getElementById('stats-content');
            if(!globalDataCache.users) { content.innerHTML = '<p>Cargando datos...</p>'; return; }

            const users = globalDataCache.users;
            const globalPlates = globalDataCache.plates || {};
            
            let allUniquePlates = new Set();
            for(let key in globalPlates) {
                if(key.includes('_')) allUniquePlates.add(key.split('_')[1]);
                else allUniquePlates.add(key);
            }
            
            window.currentModalData.GLOBAL = Array.from(allUniquePlates);

            let totalWorld = window.currentModalData.GLOBAL.length;
            let missingWorld = 10000 - totalWorld;
            let pctWorld = ((totalWorld / 10000) * 100).toFixed(2);

            let html = `
                <div onclick="openUniverse('GLOBAL')" class="bg-slate-900 p-6 rounded-3xl border border-slate-800 text-center shadow-lg mb-6 cursor-pointer active:scale-95 transition-transform relative overflow-hidden">
                    <h3 class="text-slate-400 text-sm font-black tracking-widest uppercase mb-2">Misión Familiar</h3>
                    <div class="text-5xl font-black text-white mb-2">${totalWorld} <span class="text-xl text-slate-500">/ 10000</span></div>
                    
                    <div class="h-3 bg-slate-950 rounded-full w-full overflow-hidden mb-3 border border-slate-800">
                        <div class="h-full bg-yellow-400" style="width: ${pctWorld}%"></div>
                    </div>
                    
                    <p class="text-xs text-slate-500">Nos faltan <span class="text-slate-300 font-bold">${missingWorld}</span> para completar el universo.</p>
                </div>

                <h3 class="text-white font-black text-xl mb-4 flex items-center gap-2">🏆 Ranking Detallado</h3>
            `;

            let playersStats = [];
            for(let playerName of ['NOA', 'ERIK', 'FER']) {
                let pData = users[playerName] || {};
                let myPlates = pData.my_plates || {};
                
                let arrAportadas = [];
                let arrCapicuas = [];
                let arrEscobas = [];
                let arrPokers = [];
                let truePoints = 0; 

                for(let p in myPlates) {
                    if(!arrAportadas.includes(p)) {
                        arrAportadas.push(p);
                        let wasFirst = false;
                        if (myPlates[p].isFirst === true) wasFirst = true;
                        else if (myPlates[p].pointsEarned && myPlates[p].pointsEarned % 2 === 0) wasFirst = true;
                        
                        truePoints += calculateExactPoints(p, wasFirst);

                        if(isCapicua(p)) arrCapicuas.push(p);
                        if(isEscoba(p)) arrEscobas.push(p);
                        if(isPoker(p)) arrPokers.push(p);
                    }
                }
                
                for(let key in globalPlates) {
                    if(key.startsWith(playerName + '_')) {
                        let num = key.split('_')[1];
                        if(!arrAportadas.includes(num)) {
                            arrAportadas.push(num);
                            truePoints += calculateExactPoints(num, true); 
                            
                            if(isCapicua(num)) arrCapicuas.push(num);
                            if(isEscoba(num)) arrEscobas.push(num);
                            if(isPoker(num)) arrPokers.push(num);
                        }
                    }
                }

                window.currentModalData[playerName] = {
                    aportadas: arrAportadas,
                    capicuas: arrCapicuas,
                    escobas: arrEscobas,
                    pokers: arrPokers
                };

                playersStats.push({
                    name: playerName,
                    points: truePoints, 
                    totalPlates: arrAportadas.length,
                    capicuas: arrCapicuas.length,
                    escobas: arrEscobas.length,
                    pokers: arrPokers.length
                });
            }

            playersStats.sort((a,b) => b.points - a.points);

            playersStats.forEach((p, index) => {
                let badge = index === 0 ? '🥇' : index === 1 ? '🥈' : '🥉';
                let rankLevel = getLevel(p.points); 
                
                html += `
                    <div class="bg-slate-800 rounded-2xl p-4 flex flex-col gap-3 border border-slate-700 shadow-md">
                        <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">${badge}</span>
                                <img src="${defaultAvatars[p.name]}" class="w-10 h-10 rounded-full border border-slate-500">
                                <div class="flex flex-col">
                                    <span class="font-black text-lg uppercase leading-none">${p.name}</span>
                                    <span class="text-[10px] text-yellow-400 font-bold tracking-widest uppercase">${rankLevel}</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="text-2xl font-black text-yellow-400 leading-none block">${p.points}</span>
                                <span class="text-[9px] text-slate-400 uppercase font-bold">Pts Reales</span>
                            </div>
                        </div>
                        <div class="grid grid-cols-4 gap-2 text-center">
                            <div onclick="showDetails('Aportadas de ${p.name}', '${p.name}', 'aportadas')" class="bg-slate-900 rounded-lg p-2 cursor-pointer active:scale-95 border border-slate-800 hover:border-slate-500 transition-transform">
                                <span class="block text-[9px] text-slate-400 uppercase tracking-wider mb-1">Todas</span>
                                <span class="font-bold text-white">${p.totalPlates}</span>
                            </div>
                            <div onclick="showDetails('Capicúas de ${p.name}', '${p.name}', 'capicuas')" class="bg-slate-900 rounded-lg p-2 cursor-pointer active:scale-95 border border-slate-800 hover:border-slate-500 transition-transform">
                                <span class="block text-[9px] text-slate-400 uppercase tracking-wider mb-1">Capicúa</span>
                                <span class="font-bold text-pink-400">${p.capicuas}</span>
                            </div>
                            <div onclick="showDetails('Escobas de ${p.name}', '${p.name}', 'escobas')" class="bg-slate-900 rounded-lg p-2 cursor-pointer active:scale-95 border border-slate-800 hover:border-slate-500 transition-transform">
                                <span class="block text-[9px] text-slate-400 uppercase tracking-wider mb-1">Escoba</span>
                                <span class="font-bold text-blue-400">${p.escobas}</span>
                            </div>
                            <div onclick="showDetails('Póker de ${p.name}', '${p.name}', 'pokers')" class="bg-slate-900 rounded-lg p-2 cursor-pointer active:scale-95 border border-slate-800 hover:border-slate-500 transition-transform">
                                <span class="block text-[9px] text-slate-400 uppercase tracking-wider mb-1">Póker</span>
                                <span class="font-bold text-yellow-400">${p.pokers}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            content.innerHTML = html;
        }

        const calculateUserLivePoints = (playerName) => {
            let truePoints = 0;
            let arrAportadas = [];
            const pData = globalDataCache.users[playerName] || {};
            const myPlates = pData.my_plates || {};
            const globalPlates = globalDataCache.plates || {};

            for(let p in myPlates) {
                if(!arrAportadas.includes(p)) {
                    arrAportadas.push(p);
                    let wasFirst = (myPlates[p].isFirst === true) || (myPlates[p].pointsEarned && myPlates[p].pointsEarned % 2 === 0);
                    truePoints += calculateExactPoints(p, wasFirst);
                }
            }
            for(let key in globalPlates) {
                if(key.startsWith(playerName + '_')) {
                    let num = key.split('_')[1];
                    if(!arrAportadas.includes(num)) {
                        arrAportadas.push(num);
                        truePoints += calculateExactPoints(num, true); 
                    }
                }
            }
            return truePoints;
        };

        function updateCurrentPlayerUI() {
            if(!currentPlayer || !globalDataCache || !globalDataCache.users) return;

            document.getElementById('user-points').innerText = calculateUserLivePoints(currentPlayer);

            consolidatedUserPlates = {};
            const newPlates = globalDataCache.users[currentPlayer]?.my_plates || {};
            for(let p in newPlates) {
                let wasFirst = (newPlates[p].isFirst === true) || (newPlates[p].pointsEarned && newPlates[p].pointsEarned % 2 === 0);
                consolidatedUserPlates[p] = { 
                    pointsEarned: calculateExactPoints(p, wasFirst), 
                    source: 'new', 
                    time: newPlates[p].timestamp || 0 
                };
            }
            const globalPlates = globalDataCache.plates || {};
            for(let key in globalPlates) {
                if(key.startsWith(currentPlayer + '_')) {
                    const num = key.split('_')[1];
                    if(!consolidatedUserPlates[num]) {
                        consolidatedUserPlates[num] = { pointsEarned: calculateExactPoints(num, true), source: 'old', originalKey: key, time: 0 };
                    }
                }
            }
            renderRecentPlates();
        }

        function selectPlayer(name) {
            currentPlayer = name;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('current-name').innerText = name;
            document.getElementById('current-avatar').src = defaultAvatars[name];
            
            updateCurrentPlayerUI();
        }

        // --- LÓGICA DEL FIN DE JUEGO (BROMA) ---
        let endGameTriggered = false;

        function checkEndGame() {
            if (!globalDataCache || !globalDataCache.plates) return;
            
            let allUniquePlates = new Set();
            for (let key in globalDataCache.plates) {
                if (key.includes('_')) allUniquePlates.add(key.split('_')[1]);
                else allUniquePlates.add(key);
            }

            // Aquí se comprueba que se ha llegado a 10.000 matrículas
            if (allUniquePlates.size >= 10000 && !endGameTriggered) {
                endGameTriggered = true;
                
                let players = [];
                for (let name of ['NOA', 'ERIK', 'FER']) {
                    players.push({ name: name, points: calculateUserLivePoints(name) });
                }
                players.sort((a, b) => b.points - a.points);
                let realWinner = players[0];

                const modal = document.getElementById('endgame-modal');
                const text = document.getElementById('endgame-text');
                const avatar = document.getElementById('endgame-avatar');
                const closeBtn = document.getElementById('endgame-close');
                
                modal.classList.remove('hidden');
                avatar.classList.add('hidden');
                closeBtn.classList.add('hidden');
                
                text.innerHTML = "¡10.000 MATRÍCULAS CAZADAS!<br><br><span class='text-slate-400 text-lg'>Habéis completado el universo.</span>";
                
                setTimeout(() => {
                    text.innerHTML = "Y el ganador indiscutible es...<br><br><span class='text-4xl'>🥁🥁🥁</span>";
                }, 3500);

                setTimeout(() => {
                    avatar.src = defaultAvatars['FER'];
                    avatar.classList.remove('hidden');
                    text.innerHTML = "¡¡FER!! 🏆<br><br><span class='text-sm text-yellow-500 font-normal'>(Como estaba previsto)</span>";
                }, 7000);

                setTimeout(() => {
                    if (realWinner.name === 'FER') {
                        text.innerHTML = "¡¡FER!! 🏆<br><br>Y esta vez no es broma... ¡has ganado de verdad! 😂";
                        closeBtn.classList.remove('hidden');
                    } else {
                        avatar.classList.add('hidden');
                        text.innerHTML = "<span class='text-4xl'>¡QUE ES BROMA! 😂</span><br><br><span class='text-slate-400 text-lg'>Calculando el ganador real...</span>";
                        
                        setTimeout(() => {
                            avatar.src = defaultAvatars[realWinner.name];
                            
                            avatar.style.animation = 'none';
                            avatar.offsetHeight; 
                            avatar.style.animation = null;
                            
                            avatar.classList.remove('hidden');
                            text.innerHTML = `¡El verdadero ganador es <span class='text-yellow-400 uppercase'>${realWinner.name}</span>!<br><br><span class='text-lg'>Con ${realWinner.points} puntazos. ¡Enhorabuena! 🎉</span>`;
                            closeBtn.classList.remove('hidden');
                        }, 4000);
                    }
                }, 12000);
            }
        }

        function closeEndGame() {
            document.getElementById('endgame-modal').classList.add('hidden');
            openStats();
        }

        db.ref().on('value', (snap) => {
            globalDataCache = snap.val() || { users: {}, plates: {} };
            
            if(globalDataCache.users) {
                ['NOA', 'ERIK', 'FER'].forEach(name => {
                    const levelElement = document.getElementById(`level-${name}`);
                    if(levelElement) levelElement.innerText = getLevel(calculateUserLivePoints(name));
                });
            }

            if(currentPlayer) {
                updateCurrentPlayerUI();
            }
            if(!document.getElementById('stats-modal').classList.contains('hidden')) renderStats();

            // Comprueba si habéis ganado en cada actualización
            checkEndGame(); 
        });

        function toggleRecent() {
            const panel = document.getElementById('recent-panel');
            if(panel.classList.contains('translate-y-full')) { panel.classList.remove('translate-y-full'); } 
            else { panel.classList.add('translate-y-full'); }
        }

        function renderRecentPlates() {
            const list = document.getElementById('recent-list');
            const sorted = Object.entries(consolidatedUserPlates)
                .sort((a,b) => b[1].time - a[1].time)
                .slice(0, 10);

            if(sorted.length === 0) {
                list.innerHTML = '<p class="text-slate-500 text-center text-sm mt-4">Aún no has cazado nada.</p>';
                return;
            }

            list.innerHTML = sorted.map(([plate, data]) => `
                <div class="bg-white rounded-xl p-3 flex justify-between items-center shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="bg-blue-700 w-6 h-8 rounded flex items-center justify-center text-[8px] font-black text-white">E</div>
                        <span class="text-slate-900 font-black plate-font text-2xl">${plate}</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-bold ${data.pointsEarned > 1 ? 'text-orange-500' : 'text-green-600'}">+${data.pointsEarned} pts</span>
                        <button onclick="deletePlate('${plate}')" class="bg-red-500 text-white rounded-lg w-10 h-10 flex items-center justify-center font-black active:scale-90 transition-transform">X</button>
                    </div>
                </div>
            `).join('');
        }

        function showToast(plate, pts, isFirst, isRepeat = false) {
            const toast = document.getElementById('quick-toast');
            const text = document.getElementById('toast-text');
            const subtext = document.getElementById('toast-subtext');
            
            toast.classList.remove('hidden', 'toast-active');
            void toast.offsetWidth; 
            
            let specialLabel = "";
            if (isPoker(plate)) specialLabel = "¡PÓKER!";
            else if (isEscoba(plate)) specialLabel = "¡ESCOBA!";
            else if (isCapicua(plate)) specialLabel = "¡CAPICÚA!";

            if (isRepeat) {
                toast.className = "fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 px-10 py-6 rounded-3xl font-black z-[9999] shadow-[0_10px_50px_rgba(239,68,68,0.8)] bg-red-600 text-white toast-active flex flex-col items-center justify-center";
                text.innerText = "❌";
                subtext.innerText = "YA LA TIENES";
            } else if (isFirst) {
                toast.className = "fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 px-12 py-8 rounded-3xl font-black z-[9999] shadow-[0_10px_50px_rgba(249,115,22,0.8)] bg-gradient-to-r from-orange-500 to-red-500 text-white toast-active flex flex-col items-center justify-center";
                text.innerText = `+${pts} 🔥`;
                subtext.innerText = specialLabel ? `${specialLabel} (1º)` : "¡1º EN CAZARLA!";
            } else {
                toast.className = "fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 px-12 py-8 rounded-3xl font-black z-[9999] shadow-[0_10px_50px_rgba(34,197,94,0.8)] bg-gradient-to-r from-green-500 to-emerald-500 text-white toast-active flex flex-col items-center justify-center";
                text.innerText = `+${pts} 🟢`;
                subtext.innerText = specialLabel ? `${specialLabel}` : "Añadida al álbum";
            }

            setTimeout(() => { toast.classList.add('hidden'); toast.classList.remove('toast-active'); }, 2500);
        }

        function addPlate() {
            const input = document.getElementById('plate-input');
            let plate = input.value.toString().replace(/\D/g, ''); 
            
            if (plate.length !== 4) return;

            if (consolidatedUserPlates[plate]) {
                showToast(plate, 0, false, true);
                input.value = "";
                return;
            }

            input.disabled = true;

            db.ref(`plates`).once('value', (snap) => {
                const allPlates = snap.val() || {};
                let isBonus = true;

                if (allPlates[plate] || Object.keys(allPlates).some(k => k.includes(`_${plate}`))) {
                    isBonus = false;
                }

                const pts = calculateExactPoints(plate, isBonus);

                if (isBonus) db.ref(`plates/${plate}`).set({ discoverer: currentPlayer, timestamp: Date.now() });
                
                db.ref(`users/${currentPlayer}/my_plates/${plate}`).set({ 
                    timestamp: Date.now(),
                    pointsEarned: pts,
                    isFirst: isBonus,
                    baseValue: getPlateBaseValue(plate)
                });

                showToast(plate, pts, isBonus, false);
                input.value = "";
                input.disabled = false;
                input.focus();
            });
        }

        function deletePlate(plate) {
            const plateData = consolidatedUserPlates[plate];
            if(!plateData) return;

            if(!confirm(`¿Borrar la matrícula ${plate}? Perderás ${plateData.pointsEarned} puntos.`)) return;

            if(plateData.source === 'new') {
                db.ref(`users/${currentPlayer}/my_plates/${plate}`).remove();
            } else {
                db.ref(`plates/${plateData.originalKey}`).remove();
            }
        }
    </script>
</body>
</html>
